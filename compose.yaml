services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: bullseye
      POSTGRES_USER: bullseye
      POSTGRES_PASSWORD: bullseye
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bullseye-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bullseye -d bullseye"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  bullseye-postgres:
